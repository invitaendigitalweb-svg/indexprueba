<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores de Acuarela en Movimiento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background-color: #ffffff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .panel-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(220, 210, 230, 0.5);
            box-shadow: 0 8px 32px rgba(180, 160, 190, 0.2);
        }
        input[type="range"] {
            accent-color: #a78bfa;
        }
    </style>
</head>
<body class="flex flex-col justify-center items-center min-h-screen relative select-none bg-white">

    <!-- Canvas Principal -->
    <canvas id="flowerCanvas"></canvas>

    <!-- Botón Toggle Controles -->
    <div class="fixed top-6 right-6 z-10">
        <button id="toggleControlsBtn" class="panel-glass px-4 py-2 rounded-full text-purple-900 font-medium text-sm flex items-center gap-2 hover:bg-white hover:shadow-md transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            Ajustar Viento
        </button>
    </div>

    <!-- Panel de Controles -->
    <div id="controlsPanel" class="fixed top-20 right-6 z-10 panel-glass p-5 rounded-2xl w-80 transition-all transform opacity-100 scale-100 origin-top-right">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-semibold text-purple-900 flex items-center gap-2">
                <span class="text-lg">🍃</span> Ajustar Movimiento
            </h3>
            <button id="closeControlsBtn" class="text-gray-400 hover:text-gray-600 text-sm">✕</button>
        </div>

        <div class="space-y-4">
            <div>
                <div class="flex justify-between text-xs font-medium text-purple-800 mb-1">
                    <span>Intensidad del Viento</span>
                    <span id="forceValue">1.0x</span>
                </div>
                <input type="range" id="windForce" min="0" max="3" step="0.1" value="1" class="w-full h-1.5 bg-purple-100 rounded-lg appearance-none cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between text-xs font-medium text-purple-800 mb-1">
                    <span>Velocidad de Oscilación</span>
                    <span id="speedValue">1.25x</span>
                </div>
                <input type="range" id="windSpeed" min="0.2" max="3" step="0.1" value="1.25" class="w-full h-1.5 bg-purple-100 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- Cargar otra imagen opcional -->
            <div class="pt-3 border-t border-purple-100">
                <label class="block text-xs font-medium text-purple-800 mb-2">Cambiar Imagen:</label>
                <input type="file" id="imageUploader" accept="image/*" class="text-xs text-purple-700 file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200 cursor-pointer">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // Configuración de la animación
        const params = {
            force: 1.0,
            speed: 1.25
        };

        // Elementos UI
        const windForceInput = document.getElementById('windForce');
        const windSpeedInput = document.getElementById('windSpeed');
        const forceVal = document.getElementById('forceValue');
        const speedVal = document.getElementById('speedValue');

        windForceInput.addEventListener('input', (e) => {
            params.force = parseFloat(e.target.value);
            forceVal.textContent = params.force.toFixed(1) + 'x';
        });

        windSpeedInput.addEventListener('input', (e) => {
            params.speed = parseFloat(e.target.value);
            speedVal.textContent = params.speed.toFixed(1) + 'x';
        });

        document.getElementById('toggleControlsBtn').addEventListener('click', () => {
            document.getElementById('controlsPanel').classList.toggle('hidden');
        });
        document.getElementById('closeControlsBtn').addEventListener('click', () => {
            document.getElementById('controlsPanel').classList.add('hidden');
        });

        // Imagen original
        const img = new Image();
        img.src = '9474a42f-6d7f-46c9-aca3-52e2a6b1dfaa.png';

        // Permitir subir otra imagen si el usuario lo desea
        document.getElementById('imageUploader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        let imgLoaded = false;
        img.onload = () => {
            imgLoaded = true;
            resizeCanvas();
        };

        let canvasWidth, canvasHeight;
        let renderWidth, renderHeight, offsetX, offsetY;

        let dpr = Math.min(window.devicePixelRatio || 1, 3);

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 3);
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;

            // Renderizar a mayor densidad mejora la calidad y reduce artefactos
            // visibles en las uniones de las franjas.
            canvas.width = Math.round(canvasWidth * dpr);
            canvas.height = Math.round(canvasHeight * dpr);
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            if (imgLoaded) {
                const imgRatio = img.width / img.height;
                const canvasRatio = canvasWidth / canvasHeight;

                if (canvasRatio > imgRatio) {
                    renderHeight = canvasHeight;
                    renderWidth = canvasHeight * imgRatio;
                } else {
                    renderWidth = canvasWidth;
                    renderHeight = canvasWidth / imgRatio;
                }

                offsetX = (canvasWidth - renderWidth) / 2;
                offsetY = (canvasHeight - renderHeight) / 2;
            }
        }

        window.addEventListener('resize', resizeCanvas);


        // Movimiento tipo "brisa": una malla fina permite que distintas zonas
        // de las flores se muevan con fases diferentes, en lugar de desplazar
        // toda la imagen como un solo bloque.
        // Movimiento suave tipo brisa sin líneas blancas: usamos muchas
        // franjas finas, sin desplazamiento vertical, y con un pequeño solape
        // entre cada franja para que nunca queden micro-huecos al deformarse.
        function drawAnimatedImage(time) {
            if (!imgLoaded) return;

            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            const cols = canvasWidth < 600 ? 9 : 12;
            const rows = canvasWidth < 600 ? 150 : 180;
            const timeS = time * 0.001 * params.speed;

            const AMP_MAIN = 13;
            const AMP_SECOND = 5;
            const AMP_FINE = 2.2;

            function sway(nx, ny) {
                let factor = 0;
                let phase = nx * 6.4;

                if (ny < 0.38) {
                    factor = Math.pow(ny / 0.38, 1.55);
                    const waveA = Math.sin(timeS * 2.05 + phase);
                    const waveB = Math.sin(timeS * 1.18 + nx * 10.5 + 1.7);
                    const waveC = Math.cos(timeS * 2.8 + nx * 4.0);
                    return (waveA * AMP_MAIN + waveB * AMP_SECOND + waveC * AMP_FINE) * factor * params.force;
                }

                if (ny > 0.62) {
                    factor = Math.pow((1 - ny) / 0.38, 1.55);
                    const waveA = Math.sin(timeS * 1.95 + phase + 1.1);
                    const waveB = Math.sin(timeS * 1.12 + nx * 9.0 + 2.4);
                    const waveC = Math.cos(timeS * 2.55 + nx * 4.8);
                    return (waveA * AMP_MAIN + waveB * AMP_SECOND + waveC * AMP_FINE) * factor * params.force;
                }

                return 0;
            }

            const sliceWidthSrc = img.width / cols;
            const sliceHeightSrc = img.height / rows;
            const sliceWidthDst = renderWidth / cols;
            const sliceHeightDst = renderHeight / rows;

            // Este solape elimina las líneas blancas causadas por el antialiasing
            // cuando dos franjas se desplazan en sentidos ligeramente distintos.
            const overlapSrc = Math.min(3, sliceWidthSrc * 0.08);
            const overlapDst = Math.min(3, sliceWidthDst * 0.08);
            const verticalOverlap = Math.min(2.5, sliceHeightDst * 0.35);

            for (let row = 0; row < rows; row++) {
                const normalizedY = (row + 0.5) / rows;
                const sy = Math.max(0, row * sliceHeightSrc - overlapSrc);
                const syEnd = Math.min(img.height, (row + 1) * sliceHeightSrc + overlapSrc);
                const srcH = syEnd - sy;

                const dy = offsetY + row * sliceHeightDst - verticalOverlap / 2;
                const dstH = sliceHeightDst + verticalOverlap;

                for (let col = 0; col < cols; col++) {
                    const normalizedX = (col + 0.5) / cols;
                    const sx = Math.max(0, col * sliceWidthSrc - overlapSrc);
                    const sxEnd = Math.min(img.width, (col + 1) * sliceWidthSrc + overlapSrc);
                    const srcW = sxEnd - sx;

                    const dxBase = offsetX + col * sliceWidthDst - overlapDst / 2;
                    const dstW = sliceWidthDst + overlapDst;
                    const swayX = sway(normalizedX, normalizedY);

                    ctx.drawImage(
                        img,
                        sx, sy, srcW, srcH,
                        dxBase + swayX, dy, dstW, dstH
                    );
                }
            }
        }

        function animate(timestamp) {
            drawAnimatedImage(timestamp);
            requestAnimationFrame(animate);
        }

        window.onload = function() {
            resizeCanvas();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
